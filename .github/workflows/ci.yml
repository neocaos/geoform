name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  acceptance:
    name: acceptance (GeoServer ${{ matrix.geoserver }})
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    strategy:
      # Report every version's result instead of cancelling on the first failure.
      fail-fast: false
      matrix:
        # Keep in sync with GEOSERVER_VERSIONS in the Makefile.
        geoserver: ["2.28.5", "2.25.7", "2.24.5"]
    env:
      GEOSERVER_VERSION: ${{ matrix.geoserver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: make testacc
