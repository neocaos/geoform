version: '3.8'

services:
  # 1. Base de datos geoespacial
  db:
    image: postgis/postgis:15-3.3
    container_name: geoform-db
    environment:
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopassword
      POSTGRES_DB: geoform_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geoform_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. El servidor de mapas que GeoForm va a "terraformar"
  geoserver:
    image: docker.osgeo.org/geoserver:2.24.x # Usa la versión estable que prefieras
    container_name: geoform-geoserver
    environment:
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - SKIP_DEMO_DATA=true
    ports:
      - "8080:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/rest/workspaces.json"]
      interval: 10s
      timeout: 10s
      retries: 5

  # 3. Tu aplicación en Go (Entorno de desarrollo con Live Reload opcional)
  app:
    image: golang:1.22-alpine
    container_name: geoform-app
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - GEOSERVER_URL=http://geoserver:8080/geoserver
      - GEOSERVER_USER=admin
      - GEOSERVER_PASS=geoserver
      - DATABASE_URL=postgres://geouser:geopassword@db:5432/geoform_dev?sslmode=disable
    ports:
      - "8000:8000" # Por si en el futuro expones una API HTTP además de la CLI
    stdin_open: true # Mantiene el contenedor interactivo para la CLI
    tty: true
    depends_on:
      geoserver:
        condition: service_healthy
    # Comando por defecto: se queda en espera para que tú entres y lances "go test" o "go run"
    command: sh -c "go mod download && tail -f /dev/null"

volumes:
  pgdata:
  geoserver_data: