# Stack de desarrollo: GeoServer (Kartoza) + PostGIS con datos de ejemplo.
#   docker compose -f docker-compose.dev.yml up -d --wait
# GeoServer: http://localhost:8080/geoserver  (admin / geoserver)
# PostGIS:   localhost:5432  (geouser / geopassword, db geoform)
name: geoform-dev

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopassword
      POSTGRES_DB: geoform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./test/testdata/postgis/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geoform"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [geoform]

  geoserver:
    image: kartoza/geoserver:2.28.5
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      INSTALL_EXTENSIONS: "false"
      SAMPLE_DATA: "false"
    ports:
      - "8080:8080"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u admin:geoserver http://localhost:8080/geoserver/rest/about/version.json >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [geoform]

networks:
  geoform:

volumes:
  pgdata:
  geoserver_data:
