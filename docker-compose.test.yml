# Stack efímero para integration tests (sin volúmenes; `down -v` lo limpia).
# Aislamiento entre ejecuciones (workers, CI, desarrolladores):
#   COMPOSE_PROJECT_NAME            nombre del proyecto (por defecto geoform-test)
#   GEOFORM_TEST_GEOSERVER_PORT     puerto del host de GeoServer (por defecto 18080)
#   GEOFORM_TEST_POSTGIS_PORT       puerto del host de PostGIS   (por defecto 15432)
# Si la variable está definida pero VACÍA, Docker elige un puerto libre.
# `make test-integration` usa un proyecto único y puertos libres por ejecución.
# Los puertos solo escuchan en loopback.
name: ${COMPOSE_PROJECT_NAME:-geoform-test}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopassword
      POSTGRES_DB: geoform
    ports:
      - "127.0.0.1:${GEOFORM_TEST_POSTGIS_PORT-15432}:5432"
    volumes:
      - ./test/testdata/postgis/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geoform && psql -U geouser -d geoform -tc \"select 1 from information_schema.tables where table_schema='geodata' and table_name='regions'\" | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [geoform]

  geoserver:
    image: kartoza/geoserver:2.28.5
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      INSTALL_EXTENSIONS: "false"
      SAMPLE_DATA: "false"
    ports:
      - "127.0.0.1:${GEOFORM_TEST_GEOSERVER_PORT-18080}:8080"
    volumes:
      # Fixtures de ficheros (GeoPackage, shapefile, GeoTIFF), visibles en /data/stores.
      - ./test/testdata/stores:/data/stores:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u admin:geoserver http://localhost:8080/geoserver/rest/about/version.json >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [geoform]

networks:
  geoform:
