# docker-compose.test.yml
services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.28.0
    ports:
      - "8080:8080"
    environment:
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - SKIP_DEMO_DATA=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 5s
      timeout: 5s
      retries: 20