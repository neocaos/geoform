# Configuración de goreleaser: binarios del CLI y artefactos del provider.
version: 2

project_name: geoform

before:
  hooks:
    - go mod tidy

builds:
  # CLI independiente: geoform validate|plan|apply
  - id: geoform
    main: ./cmd/geoform
    binary: geoform
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  # Provider de Terraform; el nombre debe ser terraform-provider-<tipo>_v<versión>.
  - id: provider
    main: .
    binary: "terraform-provider-geoserver_v{{ .Version }}"
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: cli
    ids: [geoform]
    formats: [tar.gz]
    name_template: "geoform_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
  # Formato exigido por el registry de Terraform: ZIP sin carpeta raíz.
  - id: provider
    ids: [provider]
    formats: [zip]
    name_template: "terraform-provider-geoserver_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE]

checksum:
  name_template: "geoform_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

# La firma GPG (requerida por el registry público) solo se activa si hay clave.
signs:
  - artifacts: checksum
    id: gpg
    args: ["--batch", "--yes", "--local-user", "{{ .Env.GPG_FINGERPRINT }}", "--output", "${signature}", "--detach-sign", "${artifact}"]


# Manifiesto del registry de Terraform, publicado como asset de la release.
release:
  extra_files:
    - glob: terraform-registry-manifest.json
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]
