# Stack de desarrollo y acceptance tests: GeoServer (Kartoza) + PostGIS sembrado.
#   docker compose up -d --wait
# GeoServer: http://localhost:8080/geoserver  (admin / geoserver)
# PostGIS:   localhost:5432  (geouser / geopassword, db geoform)
# Versión y puertos se pueden cambiar, p. ej.
#   GEOSERVER_VERSION=2.24.4 GEOSERVER_PORT=18080 POSTGIS_PORT=15432 docker compose up -d --wait
name: geoform-dev

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopassword
      POSTGRES_DB: geoform
    ports:
      - "${POSTGIS_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./test/testdata/postgis/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geoform"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [geoform]

  geoserver:
    image: kartoza/geoserver:${GEOSERVER_VERSION:-2.28.5}
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      INSTALL_EXTENSIONS: "false"
      SAMPLE_DATA: "false"
    ports:
      - "${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u admin:geoserver http://localhost:8080/geoserver/rest/about/version.json >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [geoform]

networks:
  geoform:

volumes:
  pgdata:
  geoserver_data:
